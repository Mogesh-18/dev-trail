<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#5b4bda" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DevTrail" />
    <title>DevTrail</title>
    <script>
        (function () {
            var STORAGE_KEY = "devtrail-theme";
            var stored = localStorage.getItem(STORAGE_KEY);
            var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var resolved = stored === "light" || stored === "dark" ? stored : (systemDark ? "dark" : "light");
            document.documentElement.classList.add(resolved);
            document.documentElement.style.colorScheme = resolved;
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
