<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DevTrail</title>
    <script>
        // Runs before React mounts so there's no flash of the wrong theme.
        // Mirrors the logic in src/app/providers/ThemeProvider.jsx — keep both in sync.
        (function () {
            var STORAGE_KEY = "devtrail-theme";
            var stored = localStorage.getItem(STORAGE_KEY);
            var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var resolved = stored === "light" || stored === "dark" ? stored : (systemDark ? "dark" : "light");
            document.documentElement.classList.add(resolved);
            document.documentElement.style.colorScheme = resolved;
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
